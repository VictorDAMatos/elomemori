<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Tarde na praia (ilustração fictícia)</title>
  <desc id="d">Praia tranquila com guarda-sol listrado, toalhas, um balde de areia e o mar ao fundo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ED8EE"/>
      <stop offset="1" stop-color="#E3F4F7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8FA8"/>
      <stop offset="1" stop-color="#6CC3CF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="130" cy="110" r="56" fill="#FFE08A"/>
  <g fill="#FFFFFF" opacity=".95">
    <ellipse cx="420" cy="100" rx="80" ry="22"/><ellipse cx="470" cy="88" rx="50" ry="22"/>
    <ellipse cx="640" cy="160" rx="64" ry="18"/>
  </g>
  <!-- mar -->
  <rect y="230" width="800" height="150" fill="url(#sea)"/>
  <g stroke="#FFFFFF" stroke-opacity=".7" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M40 290 q30 -16 60 0 t60 0"/><path d="M300 270 q30 -16 60 0 t60 0"/>
    <path d="M560 310 q30 -16 60 0 t60 0"/><path d="M150 340 q30 -16 60 0 t60 0"/>
  </g>
  <!-- faixa de espuma -->
  <path d="M0 372 q100 -24 200 0 t200 0 t200 0 t200 0 v22 h-800z" fill="#FFFFFF" opacity=".9"/>
  <!-- areia -->
  <rect y="384" width="800" height="216" fill="#F2DDAF"/>
  <path d="M0 450 q200 -36 400 0 t400 0 v150 h-800z" fill="#EBCF93"/>
  <!-- guarda-sol -->
  <rect x="396" y="260" width="10" height="250" fill="#8A5A2B"/>
  <path d="M290 270 a112 112 0 0 1 224 0z" fill="#F25F5C"/>
  <path d="M346 270 a56 112 0 0 1 112 0z" fill="#FFFFFF" opacity=".95" transform="translate(0 0)"/>
  <path d="M290 270 q56 24 112 0 q56 24 112 0" fill="none" stroke="#F25F5C" stroke-width="0"/>
  <!-- toalhas -->
  <rect x="140" y="470" width="190" height="70" rx="6" fill="#247BA0" transform="rotate(-4 235 505)"/>
  <g transform="rotate(-4 235 505)" fill="#FFFFFF" opacity=".85">
    <rect x="140" y="486" width="190" height="10"/><rect x="140" y="514" width="190" height="10"/>
  </g>
  <rect x="470" y="490" width="170" height="64" rx="6" fill="#E0566E" transform="rotate(5 555 522)"/>
  <!-- balde e pá -->
  <path d="M660 500 h56 l-8 50 h-40z" fill="#F2C94C"/>
  <rect x="656" y="494" width="64" height="10" rx="4" fill="#D9A21E"/>
  <path d="M720 500 q20 -28 6 -52" stroke="#D9A21E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- chinelos -->
  <ellipse cx="380" cy="560" rx="22" ry="9" fill="#3E8E8C"/>
  <ellipse cx="420" cy="566" rx="22" ry="9" fill="#3E8E8C"/>
  <!-- gaivotas -->
  <g stroke="#3A4A5A" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M560 120 q14 -14 28 0 q14 -14 28 0"/><path d="M640 84 q10 -10 20 0 q10 -10 20 0"/>
  </g>
</svg>
